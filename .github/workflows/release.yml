name: Pubblica versione

on:
  push:
    branches: [ main ]
    paths: [ 'release/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leggi versione
        id: v
        run: echo "tag=$(cat release/version.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - name: Pubblica
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: PagaGiusta ${{ steps.v.outputs.tag }}
          body_path: release/notes.md
          files: release/PagaGiusta.apk
          make_latest: true
